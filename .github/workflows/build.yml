name: Build

on:
  push:
    branches: [ "*" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout with submodules
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Cache third-party deps
      id: cache-deps
      uses: actions/cache@v4
      with:
        path: build/deps/
        key: ${{ runner.os }}-vs2026-deps-${{ hashFiles('premake5-deps.lua') }}

    - name: Build third-party dependencies
      if: steps.cache-deps.outputs.cache-hit != 'true'
      shell: cmd
      run: build_win_premake_deps.bat
      env:
        CMAKE_GENERATOR: Visual Studio 18 2026

    - name: Generate project files
      shell: cmd
      run: |
        third-party\common\win\premake\premake5.exe ^
          --file=premake5.lua --genproto --winrsrc --os=windows vs2026

    - name: Build api_regular (Release, x64)
      shell: cmd
      run: |
        msbuild /nologo /m /p:CL_MPCount=2 ^
          /p:Configuration=Release,Platform=x64 ^
          /target:api_regular ^
          build\project\vs2026\win\gbe.slnx

    - name: Build api_regular (Release, x86)
      shell: cmd
      run: |
        msbuild /nologo /m /p:CL_MPCount=2 ^
          /p:Configuration=Release,Platform=Win32 ^
          /target:api_regular ^
          build\project\vs2026\win\gbe.slnx

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: gbe-win-vs2026-release
        path: |
          build/win/vs2026/release/regular/**/
